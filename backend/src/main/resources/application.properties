spring.application.name=toolbarter-backend
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# Database Connectivity (MySQL 8.0+)
# Database Name: toolbarter
# Environment Variables: DB_URL, DB_USERNAME, DB_PASSWORD
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toolbarter?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Passw0rd@07}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=ToolbarterHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# MySQL 8.0 Community Server & Spatial Compatibility
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Consistent JSON Date/Time & Serialization (ISO-8601 UTC)
# ------------------------------------------------------------------------------
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# ------------------------------------------------------------------------------
# JWT Authentication Configuration
# ------------------------------------------------------------------------------
toolbarter.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
toolbarter.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.toolbarter=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
